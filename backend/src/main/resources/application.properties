spring.application.name=tp1c2026

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018}
spring.data.mongodb.database=${MONGO_DATABASE:tacs_db}
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.data.mongodb=DEBUG

# JWT
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-please-replace-in-prod-with-something-long-and-random}
jwt.expiration=${JWT_EXPIRATION:31536000000}

# Admin login (opcional)
admin.email=${ADMIN_EMAIL:admin@tacs.local}
admin.password=${ADMIN_PASSWORD:}
admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Permite que el mensaje de las excepciones llegue al cliente
server.error.include-message=always