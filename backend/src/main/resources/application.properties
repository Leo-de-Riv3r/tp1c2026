spring.application.name=tp1c2026

# Render asigna el puerto via la env PORT; localmente cae al 8080 que ya usa el compose.
server.port=${PORT:8080}

spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

# Sesiones (auth): el token es el id opaco de una sesión server-side en Mongo con índice TTL.
# session.ttl = vida de la sesión en ms; cada request vigente la estira (sliding). Default 1h.
session.ttl=${SESSION_TTL:3600000}

# Permite que el mensaje de las excepciones llegue al cliente
server.error.include-message=always

# Actuator / observability
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Atlas M0 restringe operaciones del MongoHealthIndicator (intenta `hello` contra el db `local`).
# La app sí se conecta correctamente para queries reales — solo el health-check tira false negative.
management.health.mongodb.enabled=false

# ─── Bonus: football-data.org (próximos partidos del Mundial 2026) ───────────
# La key se inyecta por env (FOOTBALLDATA_KEY); NUNCA en el repo. Si falta, el refresh es no-op.
footballdata.key=${FOOTBALLDATA_KEY:}
footballdata.base-url=${FOOTBALLDATA_BASE_URL:https://api.football-data.org/v4}
# WC = código de la Copa del Mundo en football-data.org. next = cuántos próximos partidos mostrar.
footballdata.competition=${FOOTBALLDATA_COMPETITION:WC}
footballdata.next=${FOOTBALLDATA_NEXT:5}
# Refresh diario (04:30). El free tier (10 calls/min) sobra para 1 call/día.
app.scheduled.upcomingMatches.cron=${APP_SCHEDULED_UPCOMINGMATCHES_CRON:0 30 4 * * *}
