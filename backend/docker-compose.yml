services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tacs-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tacs-network
    restart: "no"
    command: >
      mongosh --host mongo:27017 --quiet --eval
      'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
       while (!db.hello().isWritablePrimary) { sleep(200); }'

  mongo-seed:
    image: mongo:7.0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./seed:/seed:ro
    networks:
      - tacs-network
    command: >
      mongosh "mongodb://mongo:27017/tacs_db?directConnection=true" --file /seed/seed.js
    restart: "no"

  # Seed con datos demo (publications, auctions, proposals, offers, exchanges, snapshots).
  # Sólo se levanta con `docker compose --profile demo up`. Corre DESPUÉS de mongo-seed
  # y agrega actividad encima del catálogo + 4 users base.
  mongo-seed-full:
    image: mongo:7.0
    profiles: [demo]
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
    volumes:
      - ./seed:/seed:ro
    networks:
      - tacs-network
    command: >
      mongosh "mongodb://mongo:27017/tacs_db?directConnection=true" --file /seed/seed_full.js
    restart: "no"

  # ─── Load testing — aislado en su PROPIA base (tacs_loadtest_db); NO toca tacs_db ──────────
  # Todo el stack de carga vive detrás del profile `load-test`. Corre con:
  #   docker compose --profile load-test up --build load-test
  # Eso levanta SOLO la cadena de carga (mongo compartido + este seed + backend-loadtest + runner);
  # ni siquiera seedea tacs_db. La demo/los profes (docker compose up) quedan intactos.
  # Seedea tacs_loadtest_db con catálogo + users base (seed.js) y 50 users de carga (seed_load_test.js).
  mongo-seed-load-test:
    image: mongo:7.0
    profiles: [load-test]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./seed:/seed:ro
    environment:
      LOAD_TEST_USER_COUNT: ${LOAD_TEST_USER_COUNT:-50}
    networks:
      - tacs-network
    command: >
      sh -c "mongosh 'mongodb://mongo:27017/tacs_loadtest_db?directConnection=true' --file /seed/seed.js
      && mongosh 'mongodb://mongo:27017/tacs_loadtest_db?directConnection=true' --file /seed/seed_load_test.js"
    restart: "no"

  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mongo-seed:
        condition: service_completed_successfully
    environment:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://mongo:27017/tacs_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_URI: ${FRONTEND_URI}
    networks:
      - tacs-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/salometredici/tacs-2026-c1-fe:sha-0ef458e
    ports:
      - "80:80"
    networks:
      - tacs-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend dedicado al load test, apuntado a tacs_loadtest_db (otro puerto: 8081).
  # Locust también puede apuntar acá (localhost:8081) para no tocar tacs_db.
  backend-loadtest:
    profiles: [load-test]
    build:
      context: .
    ports:
      - "8081:8080"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mongo-seed-load-test:
        condition: service_completed_successfully
    environment:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_MONGODB_URI: mongodb://mongo:27017/tacs_loadtest_db
      JWT_SECRET: ${JWT_SECRET:-loadtestsecret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-31536000000}
      FRONTEND_URI: ${FRONTEND_URI:-http://localhost}
    networks:
      - tacs-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  load-test:
    profiles: [load-test]
    build:
      context: ./load-test
    depends_on:
      backend-loadtest:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend-loadtest:8080
      LOAD_TEST_USER_COUNT: ${LOAD_TEST_USER_COUNT:-50}
      LOAD_TEST_DURATION: ${LOAD_TEST_DURATION:-60}
      LOAD_TEST_START_USERS: ${LOAD_TEST_START_USERS:-5}
      LOAD_TEST_MAX_USERS: ${LOAD_TEST_MAX_USERS:-50}
    networks:
      - tacs-network
    restart: "no"

networks:
  tacs-network:
    driver: bridge

volumes:
  mongo_data:
